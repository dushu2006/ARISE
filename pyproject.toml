[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arise-agent"
version = "0.1.0"
description = "Windows-first, policy-gated desktop-agent runtime"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ARISE contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "psutil>=5.9,<8",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
  "ruff>=0.6,<1",
]
secure-secrets = ["keyring>=25,<27"]
browser = ["playwright>=1.45,<2"]
voice = ["google-genai>=1.55,<2"]
voice-local = [
  "kokoro-onnx>=0.6,<1",
  "numpy>=1.26,<3",
  "soxr>=0.5,<1",
  "sounddevice>=0.5,<1",
  "vosk>=0.3.45,<1",
  "webrtcvad-wheels>=2.0.14,<3",
]
packaging = ["pyinstaller>=6,<7"]

[project.scripts]
arise = "arise.cli:main"
arise-backend = "arise.server:main"
arise-voice-check = "arise.adapters.windows_voice_validation:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
